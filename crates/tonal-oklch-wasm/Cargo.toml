[package]
name = "tonal-oklch-wasm"
description = "WebAssembly bindings for tonal-oklch: batch Tonal OKLCh → sRGB conversion with exact WCAG contrast."
readme = "README.md"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tonal-oklch = { path = "../tonal-oklch", version = "0.1.0" }
wasm-bindgen = "0.2"
